name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@42213152a85ae7569bdb6bec7bcd74cd691bfe41
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@42213152a85ae7569bdb6bec7bcd74cd691bfe41

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@42213152a85ae7569bdb6bec7bcd74cd691bfe41
